name: Release 143 Music

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.1'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '24.x'

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim().TrimStart('v')
          } else {
            $version = $env:GITHUB_REF_NAME.Trim().TrimStart('v')
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must look like 1.0.1. Got: $version"
          }

          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set packaged app version
        shell: pwsh
        run: npm pkg set "version=$env:RELEASE_VERSION"

      - name: Build application
        run: pnpm build

      - name: Package Windows updater
        run: pnpm exec electron-builder --win nsis:x64 --publish never

      - name: Verify updater assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem pack -File -Filter "143-Music-Setup-$env:RELEASE_VERSION-x64.exe" | Select-Object -First 1
          $metadata = Get-Item pack/latest.yml -ErrorAction SilentlyContinue
          $blockmap = Get-ChildItem pack -File -Filter "*.blockmap" | Select-Object -First 1

          if (-not $installer) { throw 'Windows installer was not generated.' }
          if (-not $metadata) { throw 'latest.yml was not generated.' }
          if (-not $blockmap) { throw 'Updater blockmap was not generated.' }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem pack -File -Filter "143-Music-Setup-$env:RELEASE_VERSION-x64.exe").FullName
            (Get-ChildItem pack -File -Filter "143-Music-Setup-$env:RELEASE_VERSION-x64.exe.blockmap").FullName
            (Get-Item pack/latest.yml).FullName
          )

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --clobber
          } else {
            gh release create $env:RELEASE_TAG $assets `
              --target $env:GITHUB_SHA `
              --title "143 Music $env:RELEASE_VERSION" `
              --generate-notes `
              --latest
          }

          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed.' }
