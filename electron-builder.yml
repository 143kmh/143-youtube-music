appId: "com.143aimclub.music"
productName: "143 Music"
files:
  - '!*'
  - dist
  - assets
  - license
  - '!node_modules'
  - 'node_modules/custom-electron-prompt/**'
  - 'node_modules/@ghostery/adblocker-electron-preload/**'
  - 'node_modules/@ffmpeg.wasm/core-mt/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
asarUnpack:
  - assets
mac:
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/generated/icons/mac/icon.icon
  compression: maximum
win:
  icon: assets/143-music-icon.png
  artifactName: "143-Music-Setup-${version}-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
  compression: maximum
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "143 Music"
  runAfterFinish: true
  installerIcon: assets/generated/icons/win/icon.ico
  uninstallerIcon: assets/generated/icons/win/icon.ico
linux:
  icon: assets/generated/icons/png
  category: AudioVideo
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: "com.143aimclub.music"
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
        - armv7l
    - target: flatpak
      arch:
        - x64
    - target: deb
      arch:
        - x64
        - arm64
        - armv7l
    - target: rpm
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64
    - target: freebsd
      arch:
        - x64
        - arm64
        - armv7l
    - target: tar.gz
      arch:
        - x64
        - arm64
        - armv7l
appImage:
  description: "143 Music desktop client for YouTube Music"
  category: AudioVideo
flatpak:
  description: "143 Music desktop client for YouTube Music"
  category: AudioVideo
  runtimeVersion: '24.08'
  baseVersion: '24.08'
  finishArgs:
    - '--socket=wayland'
    - '--socket=x11'
    - '--share=ipc'
    - '--device=dri'
    - '--socket=pulseaudio'
    - '--share=network'
    - '--filesystem=xdg-music:rw'
    - '--talk-name=org.freedesktop.Notifications'
    - '--talk-name=org.gnome.SessionManager'
    - '--talk-name=org.kde.StatusNotifierWatcher'
    - "--own-name=org.mpris.MediaPlayer2.YouTubeMusic.*"
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libasound2
    - libgbm1
rpm:
  depends:
    - libuuid
  fpm:
    - '--rpm-rpmbuild-define'
    - _build_id_links none
snap:
  slots:
    - mpris:
        interface: mpris
directories:
  output: ./pack/
